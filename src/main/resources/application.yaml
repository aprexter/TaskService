spring:
  application:
    name: taskService

  datasource:
    url: jdbc:postgresql://localhost:5432/task_servicedb
    username: mytaskservice
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false      # Add this line
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
